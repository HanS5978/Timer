<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<title>回合計時器</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="回合計時器">
<meta name="theme-color" content="#171412">
<style>
/* Layout: one column — mode switch, big clock dial, round track, controls, settings */
:root{
  --bg:#f3f1ee; --surface:#ffffff; --fg:#1f1b18; --muted:#6f6760; --line:#ddd7d0;
  --work:#d9481f; --rest:#1f8a83; --done:#7a5bd1;
  --display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body:"Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171412; --surface:#221e1b; --fg:#f2ece6; --muted:#a69c93; --line:#3a332e;
  --work:#ff6a3d; --rest:#3cc2b8; --done:#a58cff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171412; --surface:#221e1b; --fg:#f2ece6; --muted:#a69c93; --line:#3a332e;
  --work:#ff6a3d; --rest:#3cc2b8; --done:#a58cff; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:18px;align-items:stretch}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:1.9rem;letter-spacing:.02em;margin:0;text-transform:uppercase}
.spec{color:var(--muted);font-size:.85rem}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px}
.mode b{font-size:1rem}
.mode span{font-size:.78rem;font-weight:400;color:var(--muted)}
.mode[aria-pressed="true"]{border-color:var(--work);background:color-mix(in srgb,var(--work) 12%,var(--surface))}
.mode[aria-pressed="true"] b{color:var(--work)}
.dial{position:relative;width:min(100%,320px);aspect-ratio:1;margin:0 auto;max-width:100%}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial circle{fill:none;stroke-width:14}
.track{stroke:var(--line)}
.prog{stroke:var(--accent,var(--work));stroke-linecap:round;transition:stroke .3s}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.phase{font-weight:700;font-size:1.1rem;letter-spacing:.15em;color:var(--accent,var(--work));padding:4px 14px;border:2px solid currentColor;border-radius:999px}
.time{font-family:var(--display);font-weight:800;font-size:clamp(4.5rem,24vw,6.5rem);line-height:1;font-variant-numeric:tabular-nums}
.round{font-size:1rem;color:var(--muted)}
.round b{color:var(--fg);font-family:var(--display);font-size:1.5rem;font-weight:800}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.dots.many{gap:4px}
.dots span{height:10px;border-radius:3px;background:var(--line)}
.dots.many span{height:7px;border-radius:2px}
.dots span.done{background:var(--work)}
.dots span.now{background:var(--accent,var(--work));opacity:.55}
.controls{display:grid;grid-template-columns:1fr 2fr 1fr;gap:10px}
button{font-family:var(--body);font-size:1rem;font-weight:700;padding:14px 8px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
button.main{background:var(--accent,var(--work));border-color:transparent;color:#fff;font-size:1.15rem}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent,var(--work));outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
summary{cursor:pointer;font-weight:500;color:var(--muted)}
.set{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.set label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
.set input{font:inherit;font-size:1.1rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%;min-width:0;box-sizing:border-box}
.test{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.test button{font-size:.85rem;padding:8px 12px;font-weight:500}
.note{font-size:.8rem;color:var(--muted);margin:0;text-align:center}
@media (prefers-reduced-motion: reduce){.prog{transition:none}}
</style>

</head>
<body>
<div class="wrap" id="app">
  <header>
    <h1>Round Timer</h1>
    <span class="spec" id="spec">5 分運動 + 1 分休息 × 20</span>
  </header>

  <div class="modes" aria-label="模式">
    <button class="mode" type="button" id="mLong" data-mode="long" aria-pressed="true"><b>長回合</b><span id="mLongSub">5 分 + 休 1 分 × 20</span></button>
    <button class="mode" type="button" id="mShort" data-mode="short" aria-pressed="false"><b>短間歇</b><span id="mShortSub">30 秒 + 休 5 秒 × 100</span></button>
  </div>

  <div class="dial">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <circle class="track" cx="100" cy="100" r="88"/>
      <circle class="prog" id="prog" cx="100" cy="100" r="88"/>
    </svg>
    <div class="center">
      <span class="phase" id="phase">準備</span>
      <span class="time" id="time" aria-live="off">05:00</span>
      <span class="round">第 <b id="rnum">1</b> / <span id="rtot">20</span> 回合</span>
    </div>
  </div>

  <div class="dots" id="dots" aria-label="回合進度"></div>

  <div class="controls">
    <button id="reset" type="button">重設</button>
    <button id="toggle" class="main" type="button">開始</button>
    <button id="skip" type="button">跳過</button>
  </div>

  <details>
    <summary>設定與音效測試</summary>
    <div class="set">
      <label for="w">運動（秒）<input id="w" type="number" min="5" step="5" value="300"></label>
      <label for="r">休息（秒）<input id="r" type="number" min="0" step="5" value="60"></label>
      <label for="n">回合數<input id="n" type="number" min="1" max="200" value="20"></label>
    </div>
    <div class="test">
      <button type="button" id="tStart">試聽：開始</button>
      <button type="button" id="tEnd">試聽：休息</button>
      <button type="button" id="tDone">試聽：完成</button>
      <button type="button" id="defaults">恢復此模式預設</button>
    </div>
  </details>

  <p class="note">8-bit 音效：回合開始是上升的「升級音」，進入休息是下降音，全部完成會播一段勝利旋律。計時中無法切換模式，請先按「重設」。</p>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const C=2*Math.PI*88; $('prog').style.strokeDasharray=C;

const DEFAULTS={ long:{work:300,rest:60,rounds:20}, short:{work:30,rest:5,rounds:100} };
let saved={}; try{ saved=JSON.parse(localStorage.getItem('roundTimerModes')||'{}')||{}; }catch(e){ saved={}; }
const MODES={ long:Object.assign({},DEFAULTS.long,saved.long), short:Object.assign({},DEFAULTS.short,saved.short) };
let mode='long'; try{ const m=localStorage.getItem('roundTimerMode'); if(m==='short'||m==='long') mode=m; }catch(e){}
let cfg=MODES[mode];
let state={round:1,phase:'ready',left:cfg.work,running:false,endAt:0};
let timer=null, wake=null;

// ---- 8-bit sounds: pulse / triangle / noise channels rendered to WAV, played through <audio> (works with the silent switch on)
const SR=22050;
let noiseSeed=1;
function wave(type,ph){
  const x=ph%1;
  if(type==='p12') return x<.125?1:-1;
  if(type==='p25') return x<.25?1:-1;
  if(type==='p50') return x<.5?1:-1;
  if(type==='tri'){ const t=1-4*Math.abs(x-.5); return Math.round(t*7.5)/7.5; } // 4-bit stepped triangle
  if(type==='noise'){ noiseSeed=(noiseSeed*1103515245+12345)&0x7fffffff; return (noiseSeed/0x3fffffff)-1; }
  return Math.sin(2*Math.PI*x);
}
function makeWav(notes){
  const len=Math.ceil(SR*Math.max(...notes.map(n=>n[1]+n[2]))+SR*.1), d=new Float32Array(len);
  for(const [f,s,dur,type,vol] of notes){ const a=Math.floor(s*SR), n=Math.floor(dur*SR);
    for(let i=0;i<n;i++){ const t=i/SR, rel=dur-t;
      const env=Math.min(1,t/.004)*Math.min(1,rel/.02)*(type==='noise'?Math.exp(-12*t):1);
      d[a+i]+=vol*env*wave(type,f*t); } }
  const buf=new ArrayBuffer(44+len*2), v=new DataView(buf), w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  w(0,'RIFF'); v.setUint32(4,36+len*2,true); w(8,'WAVEfmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,SR,true); v.setUint32(28,SR*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,len*2,true);
  for(let i=0;i<len;i++){ const q=Math.round(Math.max(-1,Math.min(1,d[i]))*63)/63; v.setInt16(44+i*2,q*32767,true); } // crush to ~7-bit
  let bin=''; const u=new Uint8Array(buf); for(let i=0;i<u.length;i+=8192) bin+=String.fromCharCode.apply(null,u.subarray(i,i+8192));
  return 'data:audio/wav;base64,'+btoa(bin);
}
const seq=(freqs,start,step,type,vol,last)=>freqs.map((f,i)=>[f,start+i*step,(i===freqs.length-1&&last)?last:step*.92,type,vol]);
const NOTES={
  // rising power-up arpeggio, then a held high note
  start:[
    ...seq([523,659,784,1047,659,784,1047,1319],0,.065,'p25',.32),
    [1568,.52,.42,'p25',.32],[784,.52,.42,'p50',.14],
    [131,0,.94,'tri',.5],[1,0,.06,'noise',.35]
  ],
  // falling "rest" phrase
  end:[
    ...seq([1568,1319,1047,784],0,.09,'p50',.28),
    [523,.38,.18,'p50',.28],[392,.6,.42,'p50',.28],
    [196,.38,.64,'tri',.55],[1,0,.05,'noise',.3],[1,.38,.05,'noise',.3]
  ],
  // short victory tune for the last round
  done:[
    ...seq([523,659,784],0,.1,'p25',.3),[1047,.3,.22,'p25',.3],
    ...seq([880,988],.56,.1,'p25',.3),[1047,.78,.7,'p25',.3],
    ...seq([330,392,523],0,.1,'p12',.16),[659,.3,.22,'p12',.16],[784,.78,.7,'p12',.16],
    [131,0,.52,'tri',.5],[175,.56,.2,'tri',.5],[262,.78,.7,'tri',.5]
  ]
};
const VIB={start:[300,100,300,100,600],end:[200,150,200,150,200],done:[500,200,500,200,800]};
const URLS={}; for(const k in NOTES) URLS[k]=makeWav(NOTES[k]);
// One shared player: only one sound can play at a time, and the first tap plays the real sound (no silent priming).
const player=new Audio(); player.preload='auto';
let ctx=null;
// Backup path: Web Audio, used when an <audio> element refuses to play.
function webTone(notes){
  try{ if(!ctx) return; if(ctx.state==='suspended') ctx.resume();
    const T={p12:'square',p25:'square',p50:'square',tri:'triangle',sine:'sine'};
    for(const [f,s,dur,type,vol] of notes){ if(type==='noise') continue;
      const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime+s;
      o.type=T[type]||'square'; o.frequency.value=f; g.gain.setValueAtTime(vol*.5,t); g.gain.setValueAtTime(vol*.5,t+dur-.02); g.gain.linearRampToValueAtTime(0,t+dur);
      o.connect(g).connect(ctx.destination); o.start(t); o.stop(t+dur+.02); }
  }catch(e){}
}
function audio(){ // call inside a tap so the phone lets sounds play later
  try{ if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)(); if(ctx.state==='suspended') ctx.resume(); }catch(e){}
}
function play(k){
  try{ navigator.vibrate&&navigator.vibrate(VIB[k]); }catch(e){}
  try{ player.pause(); player.src=URLS[k]; const p=player.play();
    if(p) p.catch(()=>webTone(NOTES[k]));
  }catch(e){ webTone(NOTES[k]); }
}
const soundStart=()=>play('start');
const soundEnd=()=>play('end');
const soundDone=()=>play('done');

// ---- timer
const fmt=s=>{ s=Math.max(0,Math.ceil(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
const dur=s=> s>=60 ? (s%60 ? `${Math.floor(s/60)} 分 ${s%60} 秒` : `${s/60} 分`) : `${s} 秒`;

function buildDots(){
  const d=$('dots'); d.innerHTML='';
  d.classList.toggle('many',cfg.rounds>30);
  d.style.gridTemplateColumns=`repeat(${Math.min(10,cfg.rounds)},1fr)`;
  for(let i=0;i<cfg.rounds;i++) d.appendChild(document.createElement('span'));
}
function render(){
  const p=state.phase;
  const accent = p==='rest' ? 'var(--rest)' : p==='done' ? 'var(--done)' : 'var(--work)';
  document.documentElement.style.setProperty('--accent',accent);
  $('phase').textContent={ready:'準備',work:'運動',rest:'休息',done:'完成'}[p];
  $('time').textContent=fmt(state.left);
  $('rnum').textContent=state.round; $('rtot').textContent=cfg.rounds;
  const total = p==='rest'?cfg.rest : cfg.work;
  const frac = p==='done'?1 : p==='ready'?0 : 1-state.left/total;
  $('prog').style.strokeDashoffset=C*(1-frac);
  [...$('dots').children].forEach((el,i)=>{ el.className = (i<state.round-1 || p==='done' || (i===state.round-1 && p==='rest'))?'done': (i===state.round-1 && p==='work')?'now':''; });
  $('toggle').textContent = p==='done'?'再來一次': state.running?'暫停': p==='ready'?'開始':'繼續';
  $('skip').disabled = p==='ready'||p==='done';
  $('spec').textContent=`${dur(cfg.work)}運動 + ${dur(cfg.rest)}休息 × ${cfg.rounds}`;
  $('mLongSub').textContent=`${dur(MODES.long.work)} + 休 ${dur(MODES.long.rest)} × ${MODES.long.rounds}`;
  $('mShortSub').textContent=`${dur(MODES.short.work)} + 休 ${dur(MODES.short.rest)} × ${MODES.short.rounds}`;
  const busy = p==='work'||p==='rest';
  ['mLong','mShort'].forEach(id=>{ const b=$(id); b.setAttribute('aria-pressed',b.dataset.mode===mode); b.disabled=busy && b.dataset.mode!==mode; });
  document.title=busy?`${fmt(state.left)} ${p==='work'?'運動':'休息'} ${state.round}/${cfg.rounds}`:'回合計時器';
}

function startPhase(phase){ state.phase=phase; state.left = phase==='work'?cfg.work:cfg.rest; state.endAt=performance.now()+state.left*1000; }
function next(){
  if(state.phase==='work'){
    if(state.round>=cfg.rounds){ finish(); return; }
    soundEnd();
    if(cfg.rest>0){ startPhase('rest'); return; }
    state.round++; startPhase('work'); setTimeout(soundStart,1100); return;
  }
  if(state.phase==='rest'){ state.round++; startPhase('work'); soundStart(); }
}
function finish(){ state.phase='done'; state.left=0; stop(); soundDone(); render(); }

function tick(){
  if(!state.running) return;
  state.left=(state.endAt-performance.now())/1000;
  if(state.left<=0) next();
  render();
}
async function keepAwake(){ try{ if('wakeLock' in navigator) wake=await navigator.wakeLock.request('screen'); }catch(e){} }
function run(){ state.running=true; state.endAt=performance.now()+state.left*1000; clearInterval(timer); timer=setInterval(tick,200); keepAwake(); }
function stop(){ state.running=false; clearInterval(timer); try{wake&&wake.release();}catch(e){} wake=null; }

function save(){ try{ localStorage.setItem('roundTimerModes',JSON.stringify(MODES)); localStorage.setItem('roundTimerMode',mode); }catch(e){} }
function fillInputs(){ $('w').value=cfg.work; $('r').value=cfg.rest; $('n').value=cfg.rounds; }
function readCfg(){
  const w=parseInt($('w').value,10), r=parseInt($('r').value,10), n=parseInt($('n').value,10);
  cfg.work=Math.max(5,isNaN(w)?DEFAULTS[mode].work:w);
  cfg.rest=Math.max(0,isNaN(r)?DEFAULTS[mode].rest:r);
  cfg.rounds=Math.min(200,Math.max(1,isNaN(n)?DEFAULTS[mode].rounds:n));
  save();
}
function reset(){ stop(); state={round:1,phase:'ready',left:cfg.work,running:false,endAt:0}; buildDots(); fillInputs(); render(); }
function setMode(m){ if(state.phase==='work'||state.phase==='rest') return; mode=m; cfg=MODES[m]; save(); reset(); }

$('toggle').addEventListener('click',()=>{
  audio();
  if(state.phase==='done'){ reset(); }
  if(state.phase==='ready'){ startPhase('work'); soundStart(); run(); }
  else if(state.running){ stop(); }
  else run();
  render();
});
$('reset').addEventListener('click',reset);
$('skip').addEventListener('click',()=>{ if(state.phase==='work'||state.phase==='rest'){ next(); render(); } });
$('mLong').addEventListener('click',()=>setMode('long'));
$('mShort').addEventListener('click',()=>setMode('short'));
['w','r','n'].forEach(id=>$(id).addEventListener('change',()=>{ if(state.phase==='ready'||state.phase==='done'){ readCfg(); reset(); } else fillInputs(); }));
$('defaults').addEventListener('click',()=>{ if(state.phase==='work'||state.phase==='rest') return; Object.assign(cfg,DEFAULTS[mode]); save(); reset(); });
$('tStart').addEventListener('click',()=>{ audio(); soundStart(); });
$('tEnd').addEventListener('click',()=>{ audio(); soundEnd(); });
$('tDone').addEventListener('click',()=>{ audio(); soundDone(); });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&state.running) keepAwake(); });

reset();
})();
</script>

<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
</body>
</html>
